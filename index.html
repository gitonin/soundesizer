<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f1020" />
  <title>soundesizer</title>
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <!-- Transport -->
  <header class="topbar">
    <div class="brand">soundesizer</div>
    <div class="transport">
      <button id="playBtn" class="t-btn play" aria-label="lecture / pause">▶</button>
      <div class="bpm">
        <button class="t-btn small" data-bpm="-5" aria-label="moins vite">−</button>
        <span class="bpm-read"><b id="bpmVal">120</b><i>BPM</i></span>
        <button class="t-btn small" data-bpm="5" aria-label="plus vite">+</button>
      </div>
      <div class="beats">
        <button class="t-btn beat-opt" data-beats="4">4</button>
        <button class="t-btn beat-opt sel" data-beats="8">8</button>
      </div>
      <button id="clearBtn" class="t-btn clear" aria-label="tout arrêter">⟲</button>
    </div>
  </header>

  <!-- Scène 3D -->
  <main class="stage">
    <canvas id="scene"></canvas>
    <div class="panel-label" id="panelLabel"></div>
    <div class="overlay">
      <button class="nav" id="prev" aria-label="écran précédent">‹</button>
      <div class="dots" id="dots"></div>
      <button class="nav" id="next" aria-label="écran suivant">›</button>
    </div>
    <div class="hint-3d" id="hint3d">glisser = tourner · pincer / molette = zoom · taper un objet = boucle</div>
  </main>

  <!-- Potards d'effets -->
  <div class="fxrow" id="fxrow"></div>

  <!-- Séquenceur -->
  <footer class="sequencer">
    <div class="seq-bar" id="seqBar"></div>
  </footer>

  <script src="three.min.js?v=r128"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
