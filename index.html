<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f1020" />
  <title>soundesizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Barre de transport : play, BPM, 4/8 temps, clear -->
  <header class="topbar">
    <div class="brand">soundesizer</div>
    <div class="transport">
      <button id="playBtn" class="t-btn play" aria-label="lecture / pause">▶</button>
      <div class="bpm">
        <button class="t-btn small" data-bpm="-5" aria-label="moins vite">−</button>
        <span class="bpm-read"><b id="bpmVal">110</b><i>BPM</i></span>
        <button class="t-btn small" data-bpm="5" aria-label="plus vite">+</button>
      </div>
      <div class="beats">
        <button class="t-btn beat-opt" data-beats="4">4</button>
        <button class="t-btn beat-opt sel" data-beats="8">8</button>
      </div>
      <button id="clearBtn" class="t-btn clear" aria-label="tout arrêter">⟲</button>
    </div>
  </header>

  <!-- Écrans de pads (générés par app.js) -->
  <main class="stage">
    <div class="viewport">
      <div class="track" id="track"></div>
    </div>
    <div class="panel-label" id="panelLabel"></div>
    <div class="dots" id="dots"></div>
  </main>

  <!-- Visualisation du séquenceur -->
  <footer class="sequencer">
    <div class="seq-bar" id="seqBar"></div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
